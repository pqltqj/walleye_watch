<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 510" role="img" aria-labelledby="mapTitle mapDesc"><title id="mapTitle">Mistassini Lake and the four study rivers</title><desc id="mapDesc">North is up. The long lake runs from southwest to northeast and contains elongated islands. Takwa enters near the northeast end. Chalifour, Perch, and Icon are clustered near the southern end; Icon is the southernmost. Mistissini is on the southern shore. The lake outline is adapted from the study map; the short river reaches are schematic.</desc><defs><pattern id="ripples" width="42" height="26" patternUnits="userSpaceOnUse"><path d="M0 13q12-8 24 0t24 0" fill="none" stroke="#426b5a" stroke-width="1"/></pattern></defs><rect width="900" height="510" fill="#244d3e"/><rect width="900" height="510" fill="url(#ripples)"/><path d="M414,139 L416,138 L416,137 L414,138 L415,133 L416,133 L416,137 L420,135 L420,131 L418,130 L424,129 L424,128 L426,129 L425,127 L428,127 L430,129 L426,130 L425,132 L430,131 L430,129 L439,125 L439,124 L436,124 L438,121 L441,122 L441,120 L445,117 L446,117 L446,120 L450,119 L451,121 L450,117 L452,116 L450,117 L448,116 L450,115 L456,116 L456,114 L461,116 L463,113 L460,113 L460,114 L459,113 L464,112 L465,107 L467,110 L464,113 L466,115 L470,115 L469,119 L471,119 L470,116 L474,114 L477,115 L478,113 L478,115 L480,115 L479,113 L481,112 L484,113 L483,110 L485,108 L487,109 L486,111 L488,111 L488,109 L494,109 L494,108 L498,110 L499,111 L498,118 L496,117 L497,119 L494,122 L491,122 L492,120 L488,121 L486,124 L486,128 L484,126 L485,128 L484,131 L485,129 L486,131 L482,135 L479,134 L473,137 L474,140 L471,140 L470,138 L467,142 L465,142 L465,140 L460,141 L459,143 L461,144 L458,144 L455,147 L453,147 L452,145 L455,146 L458,143 L452,144 L454,143 L453,142 L454,140 L452,142 L448,141 L451,145 L446,146 L443,150 L440,151 L441,153 L443,150 L445,150 L444,153 L442,154 L438,153 L434,157 L431,156 L430,158 L428,158 L429,160 L427,159 L426,161 L422,161 L417,168 L415,167 L416,169 L414,171